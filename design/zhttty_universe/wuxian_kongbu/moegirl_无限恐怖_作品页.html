<p><b>《无限恐怖》</b>（英语：<b><span lang="en">Terror Infinity</span></b><sup id="cite_ref-1" class="reference"><a href="#cite_note-1"><span class="cite-bracket">&#91;</span>1<span class="cite-bracket">&#93;</span></a></sup><sup id="cite_ref-2" class="reference"><a href="#cite_note-2"><span class="cite-bracket">&#91;</span>2<span class="cite-bracket">&#93;</span></a></sup>）是由<a href="/index.php?title=Zhttty&amp;action=edit&amp;redlink=1" class="new" title="Zhttty（页面不存在）">zhttty</a>创作的一部小说，并有漫画等衍生作品。
</p>

<div class="ui-dialog ui-widget ui-widget-content ui-corner-all ui-draggable ui-resizable ui-dialog-buttons" role="dialog" aria-labelledby="ui-id-2" style="outline: 0px; z-index: 1004; position: absolute; height: auto; width: 300px; top: 470px; left: 521px;"><div class="ui-dialog-titlebar ui-widget-header ui-corner-all ui-helper-clearfix"><span id="ui-id-2" class="ui-dialog-title">&#160;</span><div class="ui-dialog-titlebar-close ui-corner-all" role="button"><span class="ui-icon ui-icon-closethick">close</span></div></div><div class="ui-dialog-content ui-widget-content" style="width: auto; min-height: 36.161px; height: auto;">想明白生命的意义吗？想真正地活着吗？</div><div class="ui-resizable-handle ui-resizable-n" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-e" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-s" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-w" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-se ui-icon ui-icon-gripsmall-diagonal-se ui-icon-grip-diagonal-se" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-sw" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-ne" style="z-index: 1000;"></div><div class="ui-resizable-handle ui-resizable-nw" style="z-index: 1000;"></div><div class="ui-dialog-buttonpane ui-widget-content ui-helper-clearfix"><div class="ui-dialog-buttonset"><div class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only" role="button"><span class="ui-button-text">是</span></div><div class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only" role="button"><span class="ui-button-text">是</span></div></div></div></div>
<div class="mw-heading mw-heading3"><h3 id="作品简介"><span id=".E4.BD.9C.E5.93.81.E7.AE.80.E4.BB.8B"></span>作品简介</h3></div>
<p>在钢铁丛林中醉生梦死的白领郑吒无意中进入危险的主神空间和恐怖片世界，和信任的伙伴们一起挣扎求生的故事。
</p>
<div class="mw-heading mw-heading3"><h3 id="作品名词解释"><span id=".E4.BD.9C.E5.93.81.E5.90.8D.E8.AF.8D.E8.A7.A3.E9.87.8A"></span>作品名词解释</h3></div>
<ul><li>基因锁</li></ul>
<dl><dd>小说中的力量体系之一。设定人的能力平时遭到抑制，在极端危险的情况下会解放自己的力量，释放自己的潜力。根据解开程度共有6级。尽数解开后人将进化为全新的物种。</dd></dl>
<ul><li>主神空间</li></ul>
<dl><dd>高度发达的程序。负责安排轮回小队任务，为轮回小队提供强化属性、特殊道具的兑换。设计目的之一是刺激人类进化。</dd></dl>
<ul><li>轮回小队</li></ul>
<dl><dd>以现实世界地域划分的小队，吸收对现实世界心灰意冷的人加入，接受主神下发的任务在恐怖片世界艰难生存。</dd></dl>
<ul><li>恐怖片世界</li></ul>
<dl><dd>轮回小队接受历练的场所，通常极度危险以刺激轮回小队队员解开基因锁。</dd></dl>
<div class="mw-heading mw-heading3"><h3 id="人物简介"><span id=".E4.BA.BA.E7.89.A9.E7.AE.80.E4.BB.8B"></span>人物简介</h3></div>
<div class="mw-heading mw-heading4"><h4 id="中洲队主要成员"><span id=".E4.B8.AD.E6.B4.B2.E9.98.9F.E4.B8.BB.E8.A6.81.E6.88.90.E5.91.98"></span>中洲队主要成员</h4></div>
<ul><li>郑吒</li></ul>
<dl><dd>中洲队队长，团队的心脏。青梅竹马死后万念俱灰，对现实生活绝望进入主神空间。队伍中近战实力最强者，在作品结尾击败自己的复制体，成为全轮回小队最强者。</dd></dl>
<ul><li>詹岚</li></ul>
<dl><dd>精神力控制者，团队的眼睛。男友死于见义勇为，死后更是遭人污蔑，成为行凶者的替罪羔羊，因此对现实世界绝望。</dd></dl>
<ul><li>张杰</li></ul>
<dl><dd>前中洲队队长、引导者。</dd></dl>
<ul><li>楚轩</li></ul>
<dl><dd>最强智者。团队的大脑，负责小队战略部署、科技解析研发、同时也是中洲队数一数二的强者。现实世界是基因编辑人，失去正常激素刺激的他失去了求知欲以外的所有欲望，没有活下去的欲望的他因此进入了主神空间。</dd></dl>
<ul><li>霸王</li></ul>
<dl><dd>苏联特种部队火力手，苏联解体后加入国际雇佣军，因同伴惨死、自己身受重伤进入主神空间。</dd></dl>
<ul><li>零点</li></ul>
<dl><dd>杀手。团队的狙击手。因幸福家庭飞来横祸、爱上不该爱的人、杀死不该死的人试图自杀，机缘巧合下进入主神空间。</dd></dl>
<ul><li>赵樱空</li></ul>
<dl><dd>刺客。出身刺客世家，被称为绝无仅有的天才刺客。现实世界遭遇重大挫折后创造了第二人格进入主神空间。</dd></dl>
<ul><li>齐腾一</li></ul>
<dl><dd>辅助人员。原为考古人员，后因出土文物被他人卖至国外被骂作卖国贼，对现实绝望后进入主神空间。</dd></dl>
<ul><li>萧宏律</li></ul>
<dl><dd>团队第二智者。出生时因大脑特异被亲生父母抛弃，精神病院一爱护自己的护士死于救助自己后绝望。</dd></dl>
<ul><li>张恒</li></ul>

<div class="mw-heading mw-heading2"><h2 id="其他"><span id=".E5.85.B6.E4.BB.96"></span>其他</h2></div>
<p>版权问题比较严重地制约了该作品的发展。无限系列作品大量引用了海内外知名影视、游戏作品作为小说素材、场景、甚至剧情一部分，虽然该作品籍此吸引了大量读者，但成也萧何败也萧何，大量未经允许使用其他作品内容虽然在无限系列尚不知名时打响了名气，但若想进一步压榨该IP的价值，无论是作品版权所有者还是作者本人，都将不得不面对小说中涉及到的其他作品的版权诉讼。
</p>
